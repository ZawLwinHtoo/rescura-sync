services:
  db:
    image: postgres:15-alpine
    container_name: rescura_db
    environment:
      POSTGRES_USER: rescura
      POSTGRES_PASSWORD: rescura123
      POSTGRES_DB: rescura_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescura -d rescura_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rescura_api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RESCURA_OFFLINE: ${RESCURA_OFFLINE:-0}
      DATABASE_URL: postgresql+asyncpg://rescura:rescura123@db:5432/rescura_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
